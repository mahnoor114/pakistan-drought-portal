<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-label="Pakistan Drought Monitoring Portal system framework" style="width:100%;height:auto;display:block;background:#ffffff;font-family:Segoe UI, system-ui, sans-serif"><defs><marker id="fw-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6b7280"></path></marker></defs><g><text x="20" y="34" font-size="20" font-weight="700" fill="#111827">Pakistan Drought Monitoring Portal — system framework</text><text x="20" y="56" font-size="12.5" fill="#4b5563">Open data → Python processing → PostgreSQL → FastAPI → React portal · 126 districts · observations 1981–2025, projections to 2050</text></g><g><circle cx="31" cy="84" r="10" fill="#2563eb"></circle><text x="31" y="88" font-size="11.5" font-weight="700" fill="#ffffff" text-anchor="middle">1</text><text x="48" y="88" font-size="11.5" font-weight="700" letter-spacing="1.2" fill="#2563eb">DATA SOURCES</text></g><g><circle cx="311" cy="84" r="10" fill="#7c3aed"></circle><text x="311" y="88" font-size="11.5" font-weight="700" fill="#ffffff" text-anchor="middle">2</text><text x="328" y="88" font-size="11.5" font-weight="700" letter-spacing="1.2" fill="#7c3aed">PROCESSING (PYTHON)</text></g><g><circle cx="571" cy="84" r="10" fill="#0d9488"></circle><text x="571" y="88" font-size="11.5" font-weight="700" fill="#ffffff" text-anchor="middle">3</text><text x="588" y="88" font-size="11.5" font-weight="700" letter-spacing="1.2" fill="#0d9488">DATABASE</text></g><g><circle cx="791" cy="84" r="10" fill="#d97706"></circle><text x="791" y="88" font-size="11.5" font-weight="700" fill="#ffffff" text-anchor="middle">4</text><text x="808" y="88" font-size="11.5" font-weight="700" letter-spacing="1.2" fill="#d97706">API</text></g><g><circle cx="1011" cy="84" r="10" fill="#e11d48"></circle><text x="1011" y="88" font-size="11.5" font-weight="700" fill="#ff